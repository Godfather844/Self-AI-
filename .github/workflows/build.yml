name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Fix 1: Exact Package google-services.json
      - name: Create Exact Matching google-services.json
        run: |
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "self-ai-app",
              "storage_bucket": "self-ai-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.selfai.qzvxmk"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForSuccessfulBuild12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          find . -type d -name "app" -exec cp google-services.json {}/ \;
          cp google-services.json ./ || true

      # Fix 2: Missing debug.keystore generate karna
      - name: Generate Missing debug.keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          
          # Keystore ko root aur app folder dono jagah copy karein jahan bhi Gradle use dhoondhe
          find . -type d -name "app" -exec cp debug.keystore {}/ \;
          cp debug.keystore ./ || true

      # Fix 3: Ensure Gradle Wrapper
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      # Fix 4: Compile & Build APK (bina signing failure ke)
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m"

      # Step 5: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SelfAI-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
