name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 1: Matching google-services.json
      - name: Create Exact Matching google-services.json
        run: |
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "self-ai-app",
              "storage_bucket": "self-ai-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.selfai.qzvxmk"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForSuccessfulBuild12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          find . -type d -name "app" -exec cp google-services.json {}/ \;
          cp google-services.json ./ || true

      # Step 2: Fix KSP Headless Crash via gradle.properties
      - name: Configure Gradle & KSP flags
        run: |
          # gradle.properties me KSP aur JVM headless flags inject karo
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2560m -Djava.awt.headless=true -Dawt.toolkit=sun.awt.HeadlessToolkit" >> ~/.gradle/gradle.properties
          echo "ksp.incremental=false" >> ~/.gradle/gradle.properties
          echo "ksp.run.in.process=true" >> ~/.gradle/gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> ~/.gradle/gradle.properties
          
          # Root aur submodules ke gradle.properties me bhi append karo
          touch gradle.properties
          echo "org.gradle.jvmargs=-Xmx2560m -Djava.awt.headless=true -Dawt.toolkit=sun.awt.HeadlessToolkit" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "ksp.run.in.process=true" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties

      # Step 3: Ensure Gradle Wrapper
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      # Step 4: Build Debug APK with headless JVM options
      - name: Build Debug APK
        run: |
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            -Djava.awt.headless=true \
            -Dawt.toolkit=sun.awt.HeadlessToolkit \
            --stacktrace

      # Step 5: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SelfAI-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
