name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Virtual Framebuffer (Xvfb) install karo taaki AWT / IntelliJ ko real GUI display mile
      - name: Install Xvfb (Virtual Display for KSP/AWT)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 1: Matching google-services.json
      - name: Create Exact Matching google-services.json
        run: |
          cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "self-ai-app",
              "storage_bucket": "self-ai-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.selfai.qzvxmk"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForSuccessfulBuild12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          find . -type d -name "app" -exec cp google-services.json {}/ \;
          cp google-services.json ./ || true

      # Step 2: Ensure Gradle Wrapper
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      # Step 3: Run Build inside xvfb-run (Virtual Screen)
      - name: Build Debug APK with Virtual Display
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dksp.incremental=false \
            -Dksp.run.in.process=true \
            -Dorg.gradle.jvmargs="-Xmx2560m"

      # Step 4: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SelfAI-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
